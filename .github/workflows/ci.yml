name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test, validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 10

      - name: Test
        run: npm test
        timeout-minutes: 10

      - name: Validate data
        run: npm run validate:data
        timeout-minutes: 10

      - name: Build
        run: npm run build
        timeout-minutes: 20

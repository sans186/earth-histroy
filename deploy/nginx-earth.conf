# Nginx config for Earth Historical Timeline
# Place at: /etc/nginx/sites-available/earth
# Then: sudo ln -s /etc/nginx/sites-available/earth /etc/nginx/sites-enabled/
# Test:  sudo nginx -t
# Apply: sudo systemctl reload nginx

server {
    listen 80;
    server_name earth.tazume-sans.cn;

    root /var/www/earth;
    index index.html;

    # Enable gzip_static to serve precompressed .gz files
    gzip_static on;
    gzip_vary on;

    # Cesium workers need SharedArrayBuffer (COOP without COEP is safe for Cesium)
    add_header Cross-Origin-Opener-Policy same-origin;

    # Long cache for versioned assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long cache for Cesium static files
    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # JSON data files — moderate cache
    location ~* \.(json|geojson)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# Mirror of the repository-root nginx-earth.conf, which is the SINGLE SOURCE OF
# TRUTH. The directives below must stay identical to that file; deploy/deploy.sh
# refuses to run when the two disagree (comment lines are ignored by that check).
#
# It exists because this path is what SERVER.md's manual first-install steps and
# deploy.sh reference. Do not edit here: change ../nginx-earth.conf and copy the
# body over, so the 443/HSTS block cannot drift back into an HTTP-only copy.
#
# Install (first time only):
#   sudo cp nginx-earth.conf /etc/nginx/sites-available/earth
#   sudo ln -sfn /etc/nginx/sites-available/earth /etc/nginx/sites-enabled/earth
#   sudo nginx -t && sudo systemctl reload nginx
# Root is /var/www/earth/dist, which is the rsync target in deploy.sh.

server {
    listen 80;
    server_name earth.tazume-sans.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name earth.tazume-sans.cn;

    ssl_certificate     /etc/letsencrypt/live/earth.tazume-sans.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/earth.tazume-sans.cn/privkey.pem;

    root /var/www/earth/dist;
    index index.html;

    gzip_static on;
    gzip_vary on;

    # Security headers are declared once, at server level, because add_header is
    # not cumulative: a single add_header inside a location replaces the whole
    # inherited set. Declaring Cache-Control here and only choosing its value per
    # location keeps COOP/HSTS on every response, including /assets/ and /cesium/.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Default for anything unclassified below. Cache-Control deliberately omits
    # `always`: a 404 marked immutable would be cached for a year.
    set $earth_cache "no-cache";
    add_header Cache-Control $earth_cache;

    # The entry HTML is not content-hashed. A heuristically cached copy outlives
    # `rsync --delete`, then points at asset hashes that no longer exist and the
    # page renders blank until the user hard-refreshes.
    location = /index.html {
        set $earth_cache "no-cache";
    }

    # Content-hashed bundles: safe to pin for a year.
    location /assets/ {
        set $earth_cache "public, max-age=31536000, immutable";
    }

    # Cesium runtime, copied verbatim by vite-plugin-static-copy.
    location /cesium/ {
        set $earth_cache "public, max-age=2592000";
    }

    # Regex locations are matched in order, so this must come before the data-file
    # rule: otherwise a hidden .json would be served with a week of caching.
    location ~ /\. {
        deny all;
    }

    # Data files are refreshed by every deploy but keep their names.
    location ~* \.(json|geojson)$ {
        set $earth_cache "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth Historical Timeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0a0a0a; }

    #cesiumContainer { width: 100%; height: calc(100% - 200px); }

    /* ── Filter Bar ── */
    #filter-bar {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 16px; z-index: 100;
      background: rgba(10,10,26,0.88); border: 1px solid #3a3a5a; border-radius: 24px;
      padding: 8px 24px;
    }
    #filter-bar .filter-item {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      color: #bbb; font-size: 13px; user-select: none;
    }
    #filter-bar .filter-item .filter-dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    }
    #filter-bar .filter-item .filter-check {
      width: 16px; height: 16px; border-radius: 3px; border: 2px solid #555;
      display: flex; align-items: center; justify-content: center;
    }
    #filter-bar .filter-item.active .filter-check { background: #4a60af; border-color: #6a80cf; }
    #filter-bar .filter-item.active .filter-check::after { content: '✓'; color: #fff; font-size: 11px; }
    #filter-bar .filter-item.active { color: #fff; }

    /* ── Timeline Panel ── */
    #timeline-panel {
      width: 100%; height: 200px;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
      border-top: 2px solid #2a2a4a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 30px;
    }
    #year-display {
      color: #ffd700; font-size: 44px; font-weight: bold;
      letter-spacing: 3px; margin-bottom: 6px;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
      user-select: none; font-family: 'Georgia', 'Microsoft YaHei', serif;
    }
    #event-count {
      color: #777; font-size: 12px; margin-bottom: 10px; user-select: none;
    }
    #timeline-controls {
      display: flex; align-items: center; gap: 10px; width: 100%; max-width: 900px;
    }
    #timeline-controls .timeline-btn {
      background: #2a2a4a; border: 1px solid #4a4a7a; color: #ccc;
      padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 14px;
      transition: all 0.2s;
    }
    #timeline-controls .timeline-btn:hover { background: #3a3a5a; color: #fff; }
    #timeline-controls .timeline-btn.playing { background: #c0392b; border-color: #e74c3c; color: #fff; }

    /* ── Step Selector ── */
    #step-selector {
      display: flex; background: #1a1a3e; border: 1px solid #4a4a7a; border-radius: 5px; overflow: hidden;
    }
    #step-selector .step-opt {
      background: transparent; border: none; border-right: 1px solid #4a4a7a;
      color: #888; padding: 5px 10px; cursor: pointer; font-size: 12px;
      transition: all 0.2s;
    }
    #step-selector .step-opt:last-child { border-right: none; }
    #step-selector .step-opt.active { background: #4a60af; color: #fff; }
    #step-selector .step-opt:hover:not(.active) { background: #2a2a5a; color: #ccc; }
    #step-label { color: #888; font-size: 11px; margin-right: 4px; user-select: none; }
    #timeline-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 8px; border-radius: 4px;
      background: linear-gradient(to right, #2a1a4a 0%, #4a3060 30%, #6a5080 50%, #5a4070 70%, #3a2050 100%);
      outline: none; cursor: pointer;
    }
    #timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: #ffd700; border: 2px solid #fff;
      box-shadow: 0 0 14px rgba(255,215,0,0.7); cursor: pointer;
    }

    /* ── Event Card Popup ── */
    #event-card {
      position: fixed; top: 50%; right: 20px; transform: translateY(-50%);
      background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
      border: 1px solid #4a60af; border-radius: 14px;
      z-index: 1000; width: 420px; max-width: 90vw;
      box-shadow: 0 12px 50px rgba(0,0,0,0.8), 0 0 40px rgba(74,96,175,0.3);
      display: none; color: #e0e0e0; overflow: hidden;
    }
    #event-card.visible { display: block; animation: cardFadeIn 0.25s ease-out; }
    @keyframes cardFadeIn { from { opacity: 0; transform: translateY(-50%) translateX(20px); } to { opacity: 1; transform: translateY(-50%) translateX(0); } }
    #event-card .card-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid #2a2a4a;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    #event-card .card-header h3 { color: #ffd700; font-size: 19px; margin: 0; padding-right: 20px; }
    #event-card .card-header .close-btn {
      background: none; border: none; color: #777; font-size: 18px;
      cursor: pointer; padding: 0; line-height: 1;
    }
    #event-card .card-header .close-btn:hover { color: #fff; }
    #event-card .card-body { padding: 12px 20px 18px; max-height: 55vh; overflow-y: auto; }
    #event-card .card-body::-webkit-scrollbar { width: 4px; }
    #event-card .card-body::-webkit-scrollbar-thumb { background: #4a4a7a; border-radius: 2px; }
    #event-card .event-meta { display: flex; gap: 12px; margin-bottom: 10px; align-items: center; }
    #event-card .event-year-badge {
      color: #8ab4f8; font-size: 14px; font-weight: bold;
      background: rgba(138,180,248,0.12); padding: 2px 10px; border-radius: 10px;
    }
    #event-card .event-category {
      font-size: 12px; padding: 2px 10px; border-radius: 10px;
    }
    #event-card .event-desc { font-size: 14px; line-height: 1.7; color: #bbb; margin-bottom: 10px; }
    #event-card .event-source { font-size: 12px; color: #666; }
    #event-card .event-source a { color: #8ab4f8; text-decoration: none; }
    #event-card .event-source a:hover { text-decoration: underline; }

    /* ── Globe Year Label ── */
    #globe-year-label {
      position: fixed; right: 20px; bottom: 200px;
      color: rgba(255,255,255,0.25); font-size: 72px; font-weight: bold;
      z-index: 5; pointer-events: none; font-family: 'Georgia', serif;
      text-shadow: 0 0 30px rgba(255,215,0,0.12);
    }

    /* ── Loading / Error Overlay ── */
    #loading-overlay, #error-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(5,5,15,0.92);
    }
    #loading-overlay { display: flex; }
    #error-overlay { display: none; }
    .loader {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid rgba(255,215,0,0.2);
      border-top-color: #ffd700;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #888; font-size: 14px; margin-top: 16px; text-align: center; }
    #error-msg {
      color: #e74c3c; font-size: 16px; text-align: center; max-width: 400px; margin-bottom: 16px;
    }
    #retry-btn {
      background: #4a60af; border: none; color: #fff; padding: 10px 28px;
      border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    #retry-btn:hover { background: #5a70bf; }

    @media (max-width: 768px) {
      #filter-bar { gap: 8px; padding: 6px 14px; }
      #filter-bar .filter-item { font-size: 11px; }
      #timeline-panel { height: 160px; padding: 0 15px; }
      #year-display { font-size: 32px; }
      #event-card { width: 300px; }
      #evt-panel.open { width: 240px; }
    }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div style="text-align:center;">
      <div class="loader"></div>
      <div class="loading-text">加载历史数据中...</div>
    </div>
  </div>

  <!-- Error overlay -->
  <div id="error-overlay">
    <div style="text-align:center;">
      <div id="error-msg">加载失败，请检查网络连接后重试。</div>
      <button id="retry-btn">重试</button>
    </div>
  </div>

  <div id="cesiumContainer"></div>
  <div id="globe-year-label"></div>
  <div id="filter-bar"></div>
  <div id="timeline-panel">
    <div id="year-display">2025 AD</div>
    <div id="event-count"></div>
    <div id="timeline-controls">
      <button class="timeline-btn" id="btn-step-back" title="后退">◀</button>
      <button class="timeline-btn" id="btn-play" title="播放/暂停">▶</button>
      <button class="timeline-btn" id="btn-step-fwd" title="前进">▶</button>
      <span id="step-label">步长</span>
      <span id="step-selector">
        <button class="step-opt" data-step="1">1</button>
        <button class="step-opt" data-step="5">5</button>
        <button class="step-opt" data-step="10">10</button>
      </span>
      <input type="range" id="timeline-slider" min="-3100" max="2025" value="2025" step="1">
      <span style="color:#888;font-size:11px;white-space:nowrap;">3100 BC</span>
      <span style="color:#888;font-size:11px;white-space:nowrap;">2025 AD</span>
    </div>
  </div>
  <div id="event-card">
    <div class="card-header">
      <h3 id="event-title"></h3>
      <button class="close-btn" id="card-close-btn">✕</button>
    </div>
    <div class="card-body">
      <div class="event-meta">
        <span class="event-year-badge" id="event-year"></span>
        <span class="event-category" id="event-category"></span>
      </div>
      <div class="event-desc" id="event-desc"></div>
      <div class="event-source" id="event-source"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth Historical Timeline</title>
  <style>
    /* ═══════════════════════════════════════════
       CSS Custom Properties (theme variables)
       Default: blue-purple theme
       ═══════════════════════════════════════════ */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #0f0f1a;
      --bg-panel: rgba(10,10,26,0.88);
      --bg-panel-solid: rgba(10,10,26,0.92);
      --bg-card-start: #1a1a2e;
      --bg-card-end: #16213e;
      --bg-card-solid: #16213e;
      --bg-input: #1a1a3e;
      --bg-overlay: rgba(5,5,15,0.92);
      --bg-timeline-start: #1a1a2e;
      --bg-timeline-end: #0f0f1a;
      --border-primary: #2a2a4a;
      --border-secondary: #3a3a5a;
      --border-accent: #4a60af;
      --border-accent-hover: #6a80cf;
      --border-input: #4a4a7a;
      --text-primary: #e0e0e0;
      --text-secondary: #cccccc;
      --text-muted: #999999;
      --text-dim: #888888;
      --text-faint: #777777;
      --text-very-faint: #666666;
      --text-link: #8ab4f8;
      --text-white: #ffffff;
      --accent-gold: #ffd700;
      --accent-gold-glow: rgba(255,215,0,0.5);
      --accent-blue: #4a60af;
      --accent-blue-hover: #5a70bf;
      --accent-blue-bg: rgba(74,96,175,0.12);
      --accent-green: #2c6e49;
      --accent-green-border: #40916c;
      --accent-red: #c0392b;
      --accent-red-border: #e74c3c;
      --btn-bg: #2a2a4a;
      --btn-border: #4a4a7a;
      --btn-hover: #3a3a5a;
      --btn-text: #cccccc;
      --card-glow: rgba(74,96,175,0.3);
      --card-shadow: rgba(0,0,0,0.8);
      --scrollbar-thumb: #4a4a7a;
      --globe-ocean: #1a6080;
      --filter-dot-border: #555555;
      --track-glow: rgba(74,96,175,0.3);
      --divider: #2a2a4a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: var(--bg-primary); }

    #cesiumContainer { width: 100%; height: calc(100% - 200px); }

    #map-2d-container {
      position: fixed; top: 0; left: 0; width: 100%;
      height: calc(100% - 200px); display: none; z-index: 2;
    }
    #map-2d-container .maplibregl-ctrl-attrib { font-size: 10px; background: rgba(0,0,0,0.5); color: var(--text-dim); }
    #map-2d-container .maplibregl-ctrl-attrib a { color: var(--text-link); }
    .maplibregl-popup-content {
      background: var(--bg-panel-solid) !important; color: #ddd !important;
      border: 1px solid var(--border-accent) !important; border-radius: 8px !important;
      padding: 10px 14px !important; font: 13px 'Microsoft YaHei',sans-serif !important;
    }
    .maplibregl-popup-tip { border-top-color: var(--bg-panel-solid) !important; }

    /* ── Filter Bar ── */
    #filter-bar {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 16px; z-index: 100;
      background: var(--bg-panel); border: 1px solid var(--border-secondary); border-radius: 24px;
      padding: 8px 24px;
    }
    #filter-bar .filter-item {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      color: #bbb; font-size: 13px; user-select: none;
    }
    #filter-bar .filter-item .filter-dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    }
    #filter-bar .filter-item .filter-check {
      width: 16px; height: 16px; border-radius: 3px; border: 2px solid var(--filter-dot-border);
      display: flex; align-items: center; justify-content: center;
    }
    #filter-bar .filter-item.active .filter-check { background: var(--accent-blue); border-color: var(--border-accent-hover); }
    #filter-bar .filter-item.active .filter-check::after { content: '✓'; color: var(--text-white); font-size: 11px; }
    #filter-bar .filter-item.active { color: var(--text-white); }

    /* ── Timeline Panel ── */
    #timeline-panel {
      width: 100%; height: 200px;
      background: linear-gradient(180deg, var(--bg-timeline-start) 0%, var(--bg-timeline-end) 100%);
      border-top: 2px solid var(--border-primary);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 30px;
    }
    #year-display {
      color: var(--accent-gold); font-size: 44px; font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 20px var(--accent-gold-glow);
      user-select: none; font-family: 'Georgia', 'Microsoft YaHei', serif;
    }
    #era-display {
      display: flex; align-items: center; gap: 10px; margin-bottom: 2px;
    }
    #era-name {
      color: var(--text-white); font-size: 15px; font-weight: 600; letter-spacing: 1px;
      padding: 2px 12px; border-radius: 10px; user-select: none;
    }
    #era-range {
      color: var(--text-muted); font-size: 12px; user-select: none;
    }
    #event-count {
      color: var(--text-faint); font-size: 12px; margin-bottom: 6px; user-select: none;
    }
    #timeline-controls {
      display: flex; align-items: center; gap: 10px; width: 100%; max-width: 900px;
    }
    #timeline-controls .tl-range-label {
      color: var(--text-dim); font-size: 11px; white-space: nowrap; user-select: none;
    }

    /* ── Era Quick-Nav Bar ── */
    #era-bar {
      display: flex; gap: 4px; width: 100%; max-width: 900px;
      margin-top: 6px; flex-wrap: nowrap; overflow-x: auto;
      scrollbar-width: none; justify-content: center;
    }
    #era-bar::-webkit-scrollbar { display: none; }
    .era-chip {
      background: var(--bg-input); border: 1px solid var(--border-secondary); color: var(--text-muted);
      padding: 3px 10px; border-radius: 12px; cursor: pointer;
      font-size: 11px; transition: all 0.2s; white-space: nowrap;
      flex-shrink: 0; user-select: none;
    }
    .era-chip:hover { background: var(--btn-hover); color: #ddd; }
    .era-chip.active {
      color: var(--text-white); border-color: currentColor;
      box-shadow: 0 0 8px rgba(255,215,0,0.3);
    }
    #timeline-controls .timeline-btn {
      background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-text);
      padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 14px;
      transition: all 0.2s;
    }
    #timeline-controls .timeline-btn:hover { background: var(--btn-hover); color: var(--text-white); }
    #timeline-controls .timeline-btn.playing { background: var(--accent-red); border-color: var(--accent-red-border); color: var(--text-white); }

    /* ── Step Selector ── */
    #step-selector {
      display: flex; background: var(--bg-input); border: 1px solid var(--btn-border); border-radius: 5px; overflow: hidden;
    }
    #step-selector .step-opt {
      background: transparent; border: none; border-right: 1px solid var(--btn-border);
      color: var(--text-dim); padding: 5px 10px; cursor: pointer; font-size: 12px;
      transition: all 0.2s;
    }
    #step-selector .step-opt:last-child { border-right: none; }
    #step-selector .step-opt.active { background: var(--accent-blue); color: var(--text-white); }
    #step-selector .step-opt:hover:not(.active) { background: var(--btn-hover); color: var(--btn-text); }
    #step-label { color: var(--text-dim); font-size: 11px; margin-right: 4px; user-select: none; }
    #timeline-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 8px; border-radius: 4px;
      background: linear-gradient(to right, #2a1a4a 0%, #4a3060 30%, #6a5080 50%, #5a4070 70%, #3a2050 100%);
      outline: none; cursor: pointer;
    }
    #timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent-gold); border: 2px solid var(--text-white);
      box-shadow: 0 0 14px rgba(255,215,0,0.7); cursor: pointer;
    }

    /* ── Event Card Popup ── */
    #event-card {
      position: fixed; top: 50%; right: 20px; transform: translateY(-50%);
      background: linear-gradient(145deg, var(--bg-card-start) 0%, var(--bg-card-end) 100%);
      border: 1px solid var(--border-accent); border-radius: 14px;
      z-index: 1000; width: 420px; max-width: 90vw;
      box-shadow: 0 12px 50px var(--card-shadow), 0 0 40px var(--card-glow);
      display: none; color: var(--text-primary); overflow: hidden;
    }
    #event-card.visible { display: block; animation: cardFadeIn 0.25s ease-out; }
    @keyframes cardFadeIn { from { opacity: 0; transform: translateY(-50%) translateX(20px); } to { opacity: 1; transform: translateY(-50%) translateX(0); } }
    #event-card .card-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--divider);
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    #event-card .card-header h3 { color: var(--accent-gold); font-size: 19px; margin: 0; padding-right: 20px; }
    #event-card .card-header .close-btn {
      background: none; border: none; color: var(--text-faint); font-size: 18px;
      cursor: pointer; padding: 0; line-height: 1;
    }
    #event-card .card-header .close-btn:hover { color: var(--text-white); }
    #event-card .card-body { padding: 12px 20px 18px; max-height: 55vh; overflow-y: auto; }
    #event-card .card-body::-webkit-scrollbar { width: 4px; }
    #event-card .card-body::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 2px; }
    #event-card .event-meta { display: flex; gap: 12px; margin-bottom: 10px; align-items: center; }
    #event-card .event-year-badge {
      color: var(--text-link); font-size: 14px; font-weight: bold;
      background: var(--accent-blue-bg); padding: 2px 10px; border-radius: 10px;
    }
    #event-card .event-category {
      font-size: 12px; padding: 2px 10px; border-radius: 10px;
    }
    #event-card .event-desc { font-size: 14px; line-height: 1.7; color: #bbb; margin-bottom: 10px; }
    #event-card .event-source { font-size: 12px; color: var(--text-very-faint); }
    #event-card .event-source a { color: var(--text-link); text-decoration: none; }
    #event-card .event-source a:hover { text-decoration: underline; }

    /* ── Globe Year Label ── */
    #globe-year-label {
      position: fixed; right: 20px; bottom: 200px;
      color: rgba(255,255,255,0.25); font-size: 72px; font-weight: bold;
      z-index: 5; pointer-events: none; font-family: 'Georgia', serif;
      text-shadow: 0 0 30px rgba(255,215,0,0.12);
    }

    /* ── Loading / Error Overlay ── */
    #loading-overlay, #error-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-overlay);
    }
    #loading-overlay { display: flex; }
    #error-overlay { display: none; }
    .loader {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid rgba(255,215,0,0.2);
      border-top-color: var(--accent-gold);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-dim); font-size: 14px; margin-top: 16px; text-align: center; }
    #error-msg {
      color: var(--accent-red-border); font-size: 16px; text-align: center; max-width: 400px; margin-bottom: 16px;
    }
    #retry-btn {
      background: var(--accent-blue); border: none; color: var(--text-white); padding: 10px 28px;
      border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    #retry-btn:hover { background: var(--accent-blue-hover); }

    @media (max-width: 768px) {
      #filter-bar { gap: 8px; padding: 6px 14px; }
      #filter-bar .filter-item { font-size: 11px; }
      #timeline-panel { height: 160px; padding: 0 15px; }
      #year-display { font-size: 32px; }
      #event-card { width: 300px; }
      #evt-panel.open { width: 240px; }
    }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div style="text-align:center;">
      <div class="loader"></div>
      <div class="loading-text" id="loading-text">加载历史数据中...</div>
    </div>
  </div>

  <!-- Error overlay -->
  <div id="error-overlay">
    <div style="text-align:center;">
      <div id="error-msg">加载失败，请检查网络连接后重试。</div>
      <button id="retry-btn">重试</button>
    </div>
  </div>

  <div id="cesiumContainer"></div>
  <div id="map-2d-container"></div>
  <div id="globe-year-label"></div>
  <div id="filter-bar"></div>
  <div id="timeline-panel">
    <div id="year-display">2025 AD</div>
    <div id="era-display">
      <span id="era-name">当代</span>
      <span id="era-range">1949 — 2025</span>
    </div>
    <div id="event-count"></div>
    <div id="timeline-controls">
      <button class="timeline-btn" id="btn-step-back" title="后退">◀</button>
      <button class="timeline-btn" id="btn-play" title="播放/暂停">▶</button>
      <button class="timeline-btn" id="btn-step-fwd" title="前进">▶</button>
      <span id="step-label">步长</span>
      <span id="step-selector">
        <button class="step-opt" data-step="1">1</button>
        <button class="step-opt" data-step="5">5</button>
        <button class="step-opt" data-step="10">10</button>
      </span>
      <input type="range" id="timeline-slider" min="0" max="10000" value="10000" step="1">
      <span class="tl-range-label">3100 BC</span>
      <span class="tl-range-label">2025 AD</span>
    </div>
    <div id="era-bar"></div>
  </div>
  <div id="event-card">
    <div class="card-header">
      <h3 id="event-title"></h3>
      <button class="close-btn" id="card-close-btn">✕</button>
    </div>
    <div class="card-body">
      <div class="event-meta">
        <span class="event-year-badge" id="event-year"></span>
        <span class="event-category" id="event-category"></span>
      </div>
      <div class="event-desc" id="event-desc"></div>
      <div class="event-source" id="event-source"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

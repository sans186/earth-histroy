<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>寰宇纪年 · 全球历史时空可视化平台</title>
  <meta name="description" content="在三维地球上穿越人类文明史，横向对比不同文明在同一时刻的处境。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Boot guard styling. Inline on purpose: it must render even if the
       stylesheet pipeline is what failed. */
    #boot-guard {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 14px;
      text-align: center;
      background: #f7f5f0;
      color: #1a1c20;
      font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
      padding: 32px;
    }
    #boot-guard[hidden] {
      display: none;
    }
    #boot-guard .mark {
      width: 34px;
      height: 2px;
      background: #b0522d;
      margin: 0 auto;
    }
    #boot-guard h1 {
      font-family: 'Fraunces', 'Noto Serif SC', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }
    #boot-guard p {
      margin: 0;
      font-size: 13px;
      line-height: 1.8;
      color: #4c4f56;
      max-width: 520px;
    }
    #boot-guard code {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 12px;
      color: #b0522d;
      word-break: break-all;
    }
    #boot-guard button {
      justify-self: center;
      border: 1px solid #c9c2b3;
      background: transparent;
      padding: 7px 18px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    #boot-guard button:hover {
      border-color: #a89f8d;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!--
    Boot guard.
    A module that fails to parse or evaluate leaves #app empty and the screen
    completely blank, with the reason buried in the console. This turns that
    silence into an explainable message instead.
  -->
  <div id="boot-guard" hidden>
    <div class="mark"></div>
    <h1>页面未能启动</h1>
    <p id="boot-guard-msg">正在初始化…</p>
    <p><code id="boot-guard-detail"></code></p>
    <button type="button" onclick="location.reload()">重新加载</button>
  </div>

  <script>
    (function () {
      var firstError = '';

      window.addEventListener('error', function (event) {
        if (firstError) return;
        firstError =
          (event && (event.message || (event.error && event.error.message))) || 'Script error';
      });

      window.addEventListener('unhandledrejection', function (event) {
        if (firstError) return;
        var reason = event && event.reason;
        firstError = String((reason && (reason.message || reason)) || 'Unhandled rejection');
      });

      function reveal(msg, detail) {
        var guard = document.getElementById('boot-guard');
        if (!guard) return;
        var text = document.getElementById('boot-guard-msg');
        var extra = document.getElementById('boot-guard-detail');
        if (text && msg) text.textContent = msg;
        if (extra) extra.textContent = detail || '';
        guard.hidden = false;
      }

      var started = Date.now();
      var poll = window.setInterval(function () {
        var app = document.getElementById('app');
        if (app && app.children.length > 0) {
          window.clearInterval(poll);
          var guard = document.getElementById('boot-guard');
          if (guard) guard.hidden = true;
          return;
        }
        if (Date.now() - started < 10000) return;

        window.clearInterval(poll);
        reveal(
          firstError
            ? '应用启动时抛出异常，界面未能挂载。'
            : '应用未能在 10 秒内启动。',
          firstError || '请查看浏览器控制台（F12）与开发服务器输出以定位原因。',
        );
      }, 400);
    })();
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

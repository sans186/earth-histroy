# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name earth.tazume-sans.cn;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name earth.tazume-sans.cn;

    ssl_certificate /etc/letsencrypt/live/earth.tazume-sans.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/earth.tazume-sans.cn/privkey.pem;

    root /var/www/earth/dist;
    index index.html;

    gzip_static on;
    gzip_vary on;

    add_header Cross-Origin-Opener-Policy same-origin;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(json|geojson)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

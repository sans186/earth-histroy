# Canonical nginx site for earth.tazume-sans.cn.
#
# SINGLE SOURCE OF TRUTH. deploy/nginx-earth.conf is a mirror with the same
# directives, kept because SERVER.md's manual steps and deploy/deploy.sh refer
# to it; deploy.sh refuses to run when the directives of the two files differ
# (comment lines aside). Edit this file, then copy the body across.
#
# Layout: deploy/deploy.sh rsyncs dist/ into /var/www/earth/dist, which is this
# server's root. TLS material is issued by `certbot --nginx -d
# earth.tazume-sans.cn`; re-running certbot owns the ssl_certificate paths below,
# so install this file BEFORE certbot and let it patch the 443 block, or merge by
# hand afterwards.
#
# No Content-Security-Policy yet. index.html ships an inline boot guard and
# Cesium builds its workers from blob: URLs, so a strict script-src would need a
# nonce threaded through both the Vite build and that inline script. A CSP that
# is wrong in either place blanks the globe, which is worse than none; add it
# together with the nonce pipeline, not ahead of it.

server {
    listen 80;
    server_name earth.tazume-sans.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name earth.tazume-sans.cn;

    ssl_certificate     /etc/letsencrypt/live/earth.tazume-sans.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/earth.tazume-sans.cn/privkey.pem;

    root /var/www/earth/dist;
    index index.html;

    gzip_static on;
    gzip_vary on;

    # Security headers are declared once, at server level, because add_header is
    # not cumulative: a single add_header inside a location replaces the whole
    # inherited set. Declaring Cache-Control here and only choosing its value per
    # location keeps COOP/HSTS on every response, including /assets/ and /cesium/.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Default for anything unclassified below. Cache-Control deliberately omits
    # `always`: a 404 marked immutable would be cached for a year.
    set $earth_cache "no-cache";
    add_header Cache-Control $earth_cache;

    # The entry HTML is not content-hashed. A heuristically cached copy outlives
    # `rsync --delete`, then points at asset hashes that no longer exist and the
    # page renders blank until the user hard-refreshes.
    location = /index.html {
        set $earth_cache "no-cache";
    }

    # Content-hashed bundles: safe to pin for a year.
    location /assets/ {
        set $earth_cache "public, max-age=31536000, immutable";
    }

    # Cesium runtime, copied verbatim by vite-plugin-static-copy.
    location /cesium/ {
        set $earth_cache "public, max-age=2592000";
    }

    # Regex locations are matched in order, so this must come before the data-file
    # rule: otherwise a hidden .json would be served with a week of caching.
    location ~ /\. {
        deny all;
    }

    # Data files are refreshed by every deploy but keep their names.
    location ~* \.(json|geojson)$ {
        set $earth_cache "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
